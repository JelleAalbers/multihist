name: PyPI Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-n-publish:
    name: PyPI Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build # The modern replacement for 'setup.py sdist bdist_wheel'

      - name: Build distribution
        run: python -m build

      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Keep using your existing secret; no PyPI reconfiguration needed
          password: ${{ secrets.PYPI_API_TOKEN }}